services:
  downtify:
    container_name: downtify
    image: 'downtify:${TAG-latest}'
    restart: unless-stopped
    build: .
    ports:
      - '8000:8000'
    volumes:
      - ./docker/downloads:/downloads
      - ./docker/data:/data
      # Existing music folders (container path goes in Settings):
      # - ./mp3:/music/collection
      # - settings/server./docker/cookies.txt:/cookies.txt
    # environment:
      # - DOWNTIFY_PORT=30321
      # https://downtify.henriquesebastiao.com/getting-started/environment-variables/#getting-a-cookiestxt
      # - DOWNTIFY_COOKIES_FILE=/cookies.txt
      # - TZ=America/Sao_Paulo
      # - DOWNTIFY_MONITOR_SYNC_TIME=03:00
    dns:
      - 1.1.1.1
      - 1.0.0.1

  # The Downtify Mirror: a silent, always-online Spotify Connect
  # device for the Spotify Mirror (docs/features/spotify-mirror.md).
  # Copy spotifyd/spotifyd.conf.example to spotifyd/spotifyd.conf,
  # add your Spotify credentials there (the file is kept out of git),
  # then: docker compose up -d spotifyd
  spotifyd:
    image: 'downtify-spotifyd:latest'
    restart: unless-stopped
    build: ./spotifyd
    volumes:
      - ./spotifyd/spotifyd.conf:/etc/spotifyd.conf:ro
      - spotifyd-cache:/cache

volumes:
  spotifyd-cache: {}
