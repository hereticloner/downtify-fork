services:
  downtify:
    container_name: downtify
    image: 'downtify:${TAG-latest}'
    restart: unless-stopped
    build: .
    ports:
      - '8000:8000'
    volumes:
      - ./docker/downloads:/downloads
      - ./docker/data:/data
      # Existing music folders (container path goes in Settings):
      # - ./mp3:/music/collection
      # - settings/server./docker/cookies.txt:/cookies.txt
    # environment:
      # - DOWNTIFY_PORT=30321
      # https://downtify.henriquesebastiao.com/getting-started/environment-variables/#getting-a-cookiestxt
      # - DOWNTIFY_COOKIES_FILE=/cookies.txt
      # - TZ=America/Sao_Paulo
      # - DOWNTIFY_MONITOR_SYNC_TIME=03:00
    dns:
      - 1.1.1.1
      - 1.0.0.1
    # ~300 MB steady state (75 MB fresh); headroom for ffmpeg transcode
    # children, which share this cgroup. Raise if downloads get OOM-killed.
    mem_limit: 512m
    # json-file would otherwise grow without bound.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # The Downtify Mirror: a silent, always-online Spotify Connect
  # device for the Spotify Mirror (docs/features/spotify-mirror.md).
  # It runs Spotify Soloist - Spotify's own headless client - so plays
  # sent to it are recorded as real listening; go-librespot, an
  # unofficial engine, was not. Pair it once with
  # `docker compose run --rm mirror pair`; the session lands in the
  # `soloist_data` volume, so restarts don't need pairing again.
  # Soloist builds expire after 90 days: rebuild the image before then.
  mirror:
    build:
      context: ./mirror
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SOLOIST_API_KEY=${SOLOIST_API_KEY}
      - SOLOIST_DEVICE_NAME=Downtify Mirror
    volumes:
      - soloist_data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  soloist_data:
