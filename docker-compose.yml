services:
  downtify:
    container_name: downtify
    image: 'downtify:${TAG-latest}'
    restart: unless-stopped
    build: .
    ports:
      - '8000:8000'
    volumes:
      - ./docker/downloads:/downloads
      - ./docker/data:/data
      # Existing music folders (container path goes in Settings):
      # - ./mp3:/music/collection
      # - settings/server./docker/cookies.txt:/cookies.txt
    # environment:
      # - DOWNTIFY_PORT=30321
      # https://downtify.henriquesebastiao.com/getting-started/environment-variables/#getting-a-cookiestxt
      # - DOWNTIFY_COOKIES_FILE=/cookies.txt
      # - TZ=America/Sao_Paulo
      # - DOWNTIFY_MONITOR_SYNC_TIME=03:00
    dns:
      - 1.1.1.1
      - 1.0.0.1
    # ~300 MB steady state (75 MB fresh); headroom for ffmpeg transcode
    # children, which share this cgroup. Raise if downloads get OOM-killed.
    mem_limit: 512m
    # json-file would otherwise grow without bound.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # The Downtify Mirror: a silent, always-online Spotify Connect
  # device for the Spotify Mirror (docs/features/spotify-mirror.md).
  # go-librespot logs a pairing code on first start - enter it at
  # https://spotify.com/pair; the credentials land in mirror/state.json.
  mirror:
    image: 'ghcr.io/devgianlu/go-librespot:v0.10.3'
    restart: unless-stopped
    volumes:
      - ./mirror:/config
    # No mem_limit: go-librespot was never measured under a Connect
    # session, and an over-tight cap would silently drop the device
    # instead of failing loudly. Log growth is bounded instead.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes: {}
